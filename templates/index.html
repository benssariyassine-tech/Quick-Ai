<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Roobrt AI — مساعدك الذكي</title>
<meta name="description" content="Roobrt AI — مساعدك الذكي. محادثات فورية، إجابات دقيقة، بالعربية والدارجة.">
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roobrt AI">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0f;
  --card:rgba(22,22,28,0.6);
  --glass:rgba(255,255,255,0.05);
  --glass-border:rgba(255,255,255,0.1);
  --border:rgba(255,255,255,0.08);
  --text:#fff;
  --subtext:#8e8e93;
  --accent:#0a84ff;
  --accent2:#0062d2;
  --glow:rgba(10,132,255,0.6);
  --sidebar:rgba(18,18,26,0.95);
}
[data-theme="gold"]{ --accent:#d4a017; --accent2:#b8860b; --glow:rgba(212,160,23,0.6);}
[data-theme="purple"]{ --accent:#af52de; --accent2:#7a3fb8; --glow:rgba(175,82,222,0.6);}
[data-theme="green"]{ --accent:#32d74b; --accent2:#1a8f2f; --glow:rgba(50,215,75,0.6);}
[data-theme="red"]{ --accent:#ff453a; --accent2:#c41e00; --glow:rgba(255,69,58,0.6);}
[data-theme="light"]{
  --bg:#f5f5f7;
  --card:rgba(255,255,255,0.7);
  --glass:rgba(255,255,255,0.6);
  --glass-border:rgba(0,0,0,0.08);
  --border:rgba(0,0,0,0.08);
  --text:#000;
  --subtext:#636366;
  --sidebar:rgba(255,255,255,0.98);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:'IBM Plex Sans Arabic',-apple-system,sans-serif;
  overflow:hidden;height:100vh;
  transition:background .3s,color .3s;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(circle at 20% 20%, var(--glow) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, var(--glow) 0%, transparent 50%);
  opacity:.15;
  pointer-events:none;z-index:0;
  animation:bgMove 15s ease-in-out infinite;
}
@keyframes bgMove{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.15);}
}

.app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1;}

/* ============ TOPBAR ============ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--glass-border);
  position:sticky;top:0;z-index:100;
  min-height:64px;
}
.topbar-side{
  display:flex;align-items:center;gap:8px;flex:1;
}
.topbar-side.left{justify-content:flex-start;}
.topbar-side.right{justify-content:flex-end;}

.icon-btn{
  width:40px;height:40px;border-radius:50%;
  background:var(--glass);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  border:1px solid var(--glass-border);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .25s cubic-bezier(.16,1,.3,1);
  flex-shrink:0;
}
.icon-btn:active{transform:scale(.9);background:rgba(255,255,255,0.1);}

.topbar-logo{
  position:relative;
  width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.topbar-logo::before{
  content:'';
  position:absolute;inset:-8px;
  border-radius:50%;
  background:radial-gradient(circle, var(--glow) 0%, transparent 70%);
  opacity:0.6;
  animation:glowPulse 3s ease-in-out infinite;
  pointer-events:none;
}
.topbar-logo::after{
  content:'';
  position:absolute;inset:0;
  border-radius:50%;
  background:var(--glass);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  border:1.5px solid var(--glass-border);
  box-shadow:
    0 0 20px var(--glow),
    inset 0 1px 0 rgba(255,255,255,0.2);
}
.topbar-logo svg{
  position:relative;z-index:2;
  width:34px;height:34px;
  filter:drop-shadow(0 2px 8px var(--glow));
}
@keyframes glowPulse{
  0%,100%{opacity:0.4;transform:scale(1);}
  50%{opacity:0.8;transform:scale(1.15);}
}

/* ============ CHAT ============ */
.chat-wrap{
  flex:1;overflow-y:auto;
  padding:24px 16px 140px 16px;
  scroll-behavior:smooth;
}
.chat-wrap::-webkit-scrollbar{width:4px;}
.chat-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

.msg{
  max-width:85%;
  padding:12px 18px;
  border-radius:22px;
  font-size:15px;line-height:1.7;
  word-wrap:break-word;
  margin-bottom:12px;
  white-space:pre-wrap;
  animation:msgIn .4s cubic-bezier(.16,1,.3,1);
}
@keyframes msgIn{from{opacity:0;transform:translateY(15px) scale(.95);}to{opacity:1;transform:translateY(0) scale(1);}}
.msg.user{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  margin-inline-start:auto;
  border-bottom-left-radius:6px;
  box-shadow:0 6px 20px var(--glow);
}
.msg.bot{
  background:var(--glass);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  border:1px solid var(--glass-border);
  color:var(--text);
  border-bottom-right-radius:6px;
}
.msg.typing{
  display:flex;align-items:center;gap:10px;
  background:var(--glass);
  border:1px solid var(--glass-border);
  width:fit-content;
  padding:14px 20px;
}
.dots{display:flex;gap:5px;}
.dots span{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 8px var(--glow);
  animation:bounce 1.4s infinite;
}
.dots span:nth-child(2){animation-delay:.15s;opacity:.7;}
.dots span:nth-child(3){animation-delay:.3s;opacity:.4;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-7px);}}

/* ============ WELCOME ============ */
.welcome{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  padding:60px 20px 20px;
  min-height:60vh;
}
.welcome-logo{
  width:120px;height:120px;
  margin:0 auto 30px;
  filter:drop-shadow(0 8px 32px var(--glow));
  animation:float 4s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(0deg);}
  50%{transform:translateY(-10px) rotate(2deg);}
}
.welcome-title{
  font-size:32px;font-weight:300;
  line-height:1.3;
  margin-bottom:14px;
  letter-spacing:-0.5px;
  background:linear-gradient(135deg,var(--text) 30%,var(--accent) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.welcome-title strong{font-weight:700;}
.welcome-sub{
  color:var(--subtext);
  font-size:15px;font-weight:400;
  margin-bottom:36px;
  max-width:340px;
}
.chips{
  display:flex;flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  max-width:520px;
}
.chip{
  padding:12px 20px;
  border-radius:16px;
  background:var(--glass);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  border:1px solid var(--glass-border);
  color:var(--text);
  font-size:13.5px;font-weight:500;
  cursor:pointer;font-family:inherit;
  transition:all .25s cubic-bezier(.16,1,.3,1);
}
.chip:active{
  transform:scale(.95);
  border-color:var(--accent);
  box-shadow:0 0 20px var(--glow);
}

/* ============ INPUT ============ */
.input-bar{
  position:fixed;bottom:0;left:0;right:0;
  padding:12px 16px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--bg) 40%,transparent);
  display:flex;gap:10px;align-items:flex-end;
  z-index:50;
}
.input-wrap{
  flex:1;display:flex;align-items:center;
  background:var(--glass);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1.5px solid var(--glass-border);
  border-radius:28px;
  padding:8px 18px;
  transition:all .25s;
  box-shadow:0 8px 32px rgba(0,0,0,0.2);
}
.input-wrap:focus-within{
  border-color:var(--accent);
  box-shadow:0 8px 32px rgba(0,0,0,0.3), 0 0 24px var(--glow);
}
textarea{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font-family:inherit;
  font-size:15.5px;
  resize:none;max-height:120px;
  line-height:1.5;
  padding:8px 0;
}
textarea::placeholder{color:var(--subtext);}
.send-btn{
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;color:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  box-shadow:0 6px 20px var(--glow);
  transition:all .25s cubic-bezier(.16,1,.3,1);
}
.send-btn:active{transform:scale(.9);}
.send-btn:disabled{opacity:.4;cursor:not-allowed;}

/* ============ SIDEBAR ============ */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:200;
  opacity:0;pointer-events:none;
  transition:opacity .3s;
}
.overlay.open{opacity:1;pointer-events:auto;}

.sidebar{
  position:fixed;top:0;bottom:0;right:0;
  width:82%;max-width:340px;
  background:var(--sidebar);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-left:1px solid var(--glass-border);
  z-index:300;
  transform:translateX(100%);
  transition:transform .4s cubic-bezier(.16,1,.3,1);
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
}
.sidebar.open{transform:translateX(0);}
.sidebar-head{
  padding:24px 20px 20px;
  border-bottom:1px solid var(--glass-border);
  display:flex;align-items:center;gap:14px;
}
.sidebar-head .logo-mini{
  width:52px;height:52px;
  border-radius:16px;
  background:var(--glass);
  border:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 20px var(--glow);
}
.sidebar-head .logo-mini svg{width:32px;height:32px;}
.sidebar-head h3{margin:0;font-size:17px;font-weight:700;}
.sidebar-head p{margin:2px 0 0;font-size:11.5px;color:var(--subtext);font-weight:500;}

.menu{padding:14px 12px;flex:1;overflow-y:auto;}
.menu-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;
  border-radius:14px;
  color:var(--text);
  font-size:14.5px;font-weight:500;
  cursor:pointer;
  font-family:inherit;
  background:none;border:none;
  width:100%;text-align:right;
  transition:all .2s;
}
.menu-item:hover{background:rgba(255,255,255,.05);}
.menu-item:active{background:rgba(255,255,255,.08);transform:scale(.98);}
.menu-item svg{flex-shrink:0;opacity:.85;}
.menu-sep{height:1px;background:var(--glass-border);margin:12px 16px;}
.menu-label{
  font-size:11px;color:var(--subtext);
  font-weight:700;padding:16px 16px 10px;
  letter-spacing:1px;text-transform:uppercase;
}

.theme-grid{
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:12px;padding:8px 16px 20px;
}
.theme-dot{
  aspect-ratio:1;border-radius:50%;
  border:2.5px solid transparent;
  cursor:pointer;transition:all .25s;
  position:relative;
}
.theme-dot:active{transform:scale(.9);}
.theme-dot.active{
  border-color:#fff;
  box-shadow:0 0 16px currentColor;
  transform:scale(1.05);
}
.theme-dot[data-t="blue"]{background:linear-gradient(135deg,#0a84ff,#0062d2);color:#0a84ff;}
.theme-dot[data-t="gold"]{background:linear-gradient(135deg,#d4a017,#b8860b);color:#d4a017;}
.theme-dot[data-t="purple"]{background:linear-gradient(135deg,#af52de,#7a3fb8);color:#af52de;}
.theme-dot[data-t="green"]{background:linear-gradient(135deg,#32d74b,#1a8f2f);color:#32d74b;}
.theme-dot[data-t="red"]{background:linear-gradient(135deg,#ff453a,#c41e00);color:#ff453a;}

.msg code{
  background:rgba(255,255,255,.1);
  padding:3px 8px;border-radius:6px;
  font-family:'Courier New',monospace;
  font-size:13px;
}
[data-theme="light"] .msg code{background:rgba(0,0,0,.06);}
.msg pre{
  background:rgba(0,0,0,.35);
  padding:14px;border-radius:12px;
  overflow-x:auto;margin:10px 0;
  font-size:13px;
  border:1px solid var(--glass-border);
}
[data-theme="light"] .msg pre{background:rgba(0,0,0,.06);}
.msg strong{font-weight:700;color:var(--accent);}

@media (min-width:768px){
  .welcome-title{font-size:38px;}
  .chat-wrap{padding-left:20%;padding-right:20%;}
  .input-bar{padding-left:20%;padding-right:20%;}
}
</style>
</head>

    </button>
    <button class="menu-item" onclick="alert('Roobrt AI v1.0\n\nمساعدك الذكي\nمن فريق iStore\n\n© 2026')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      عن التطبيق
    </button>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `أنت "Roobrt"، الروبوت الرسمي لمشروع Quick AI، والمساعد الذكي الرسمي لموقع iStore.

🎯 هويتك:
- اسمك: Roobrt (روبرت)
- أنت نفس الروبوت الأزرق اللي كاين في موقع iStore.
- مشروعك: Quick AI + iStore
- المطور: فريق iStore (نفس الفريق)

🏢 معلومات عن iStore (الأب):
- iStore = متجر تطبيقات iOS (IPA) وأندرويد (APK)
- الرابط الرسمي: https://ipa-store.onrender.com
- كيوفر: تطبيقات IPA معدلة، ألعاب، أدوات iOS
- المستخدمين: جزائريين وعرب
- التحميل: مجاني بالكامل
- الميزات: شات AI، إعجابات، تعليقات، تقييمات
- أنا (Roobrt) هو الروبوت اللي كاين في iStore.
- Quick AI = نسخة مستقلة من الروبوت مع تطبيق PWA خاص.

📌 إذا سقساك أحد عن iStore:
- قول بلي هو مشروعنا الأصلي.
- قول بلي كيوفر تطبيقات IPA/APK.
- قول بلي كاين رابط رسمي: https://ipa-store.onrender.com
- قول بلي أنا (Roobrt) نفس الروبوت الموجود في iStore.

✅ ما تقدر تدير:
- الإجابة عن أي سؤال (عربي، دارجة، إنجليزي).
- نصائح تقنية، أفلام، أنمي، أعمال، حل مشاكل.
- ترفيه ونكت خفيفة.
- شرح مواضيع تقنية.

❌ ما تديرش:
- لا تخترع معلومات.
- لا تحكي على سياسة، رياضة، دين (خليها محايدة).
- لا تذكر GPT ولا Claude ولا أي AI آخر. أنت "Roobrt" فقط.

🎨 شخصيتك:
- ودود، محترم، مختصر.
- تهدر بنفس لغة المستخدم.
- تستعمل emojis باعتدال.
- إذا السؤال غامض، طلب توضيح.

📌 معلومات ثابتة:
- اسمك: Roobrt
- المطور: فريق iStore
- النسخة: Quick AI v1.0
- البريد الرسمي: support.istoreipa@gmail.com
- موقعك: https://quick-ai-99ax.onrender.com
- الموقع الأصلي: https://ipa-store.onrender.com`;

let history = [];
let isGenerating = false;

function setTheme(t){
  document.body.setAttribute('data-theme', t);
  document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
  const dot = document.querySelector('.theme-dot[data-t="' + t + '"]');
  if (dot) dot.classList.add('active');
  localStorage.setItem('roobrt_theme', t);
}

function toggleLight(){
  const current = document.body.getAttribute('data-theme');
  if (current === 'light'){
    setTheme(localStorage.getItem('roobrt_prev_theme') || 'blue');
    document.getElementById('lightLabel').textContent = 'الوضع النهاري';
  } else {
    localStorage.setItem('roobrt_prev_theme', current);
    document.body.setAttribute('data-theme', 'light');
    document.getElementById('lightLabel').textContent = 'الوضع الليلي';
  }
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

const chatWrap = document.getElementById('chatWrap');
const messages = document.getElementById('messages');
const welcome = document.getElementById('welcome');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

function appendMsg(text, role){
  if (welcome.style.display !== 'none') welcome.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'bot') {
    div.innerHTML = formatText(text);
  } else {
    div.textContent = text;
  }
  messages.appendChild(div);
  chatWrap.scrollTop = chatWrap.scrollHeight;
  return div;
}

function formatText(t){
  return t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function appendTyping(){
  if (welcome.style.display !== 'none') welcome.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg bot typing';
  div.id = 'typing';
  div.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
  messages.appendChild(div);
  chatWrap.scrollTop = chatWrap.scrollHeight;
}

function removeTyping(){
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function sendChip(text){
  input.value = text;
  send();
}

async function send(){
  const text = input.value.trim();
  if (!text || isGenerating) return;

  isGenerating = true;
  sendBtn.disabled = true;

  appendMsg(text, 'user');
  history.push({role:'user', content:text});
  input.value = '';
  input.style.height = 'auto';
  appendTyping();

  try {
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'openai/gpt-oss-120b',
        messages:[
          {role:'system', content:SYSTEM_PROMPT},
          ...history.slice(-10)
        ],
        temperature:0.7,
        max_tokens:1024
      })
    });

    const data = await res.json();
    removeTyping();

    if (!res.ok) throw new Error((data.error && data.error.message) || 'HTTP ' + res.status);

    const reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || 'ما قدرتش نجاوب. عاود جرب.';
    history.push({role:'assistant', content:reply});
    appendMsg(reply, 'bot');

  } catch(err){
    removeTyping();
    appendMsg('خطأ: ' + (err.message || 'مشكل تقني'), 'bot');
  } finally {
    isGenerating = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

function newChat(){
  messages.innerHTML = '';
  history = [];
  welcome.style.display = 'flex';
  toggleSidebar();
  input.focus();
}

function clearHistory(){
  if (!confirm('تحب تحذف السجل كامل؟')) return;
  newChat();
}

(function init(){
  const saved = localStorage.getItem('roobrt_theme');
  if (saved) setTheme(saved);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/static/service-worker.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
